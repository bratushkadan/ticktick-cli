      required:
        - name
      properties:
        name:
          type: string
          description: Project group name (max 64 chars).

    ProjectGroupUpdateRequest:
      type: object
      description: Request body for updating a project group. All fields are optional.
      properties:
        name:
          type: string
          description: Project group name (max 64 chars).

    ColumnCreateRequest:
      type: object
      description: Request body for creating a column.
      required:
        - name
      properties:
        name:
          type: string
          description: Column name (max 1000 chars).

    ColumnUpdateRequest:
      type: object
      description: Request body for updating a column. All fields are optional.
      properties:
        name:
          type: string
          description: Column name (max 1000 chars).

    TagCreateRequest:
      type: object
      description: Request body for creating a tag.
      required:
        - name
