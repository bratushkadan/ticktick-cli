openapi: 3.0.3
info:
  title: TickTick Open API
  description: |
    Machine-readable OpenAPI spec compiled from the official TickTick Open API
    documentation (https://developer.ticktick.com/docs#/openapi); snapshot in
    docs/openapi.md. Focus: business entities and successful responses; 4xx
    error codes are intentionally not described.
    All date-time fields use TickTick format yyyy-MM-dd'T'HH:mm:ssZ (e.g.
    2019-11-13T03:00:00+0000) and are typed as plain strings because the
    colon-less offset is not RFC3339.
  version: 1.0.0
servers:
  - url: https://api.ticktick.com
security:
  - BearerAuth: []
paths:
  /open/v1/preference:
    post:
      tags:
        - Preference
      operationId: GetUserPreferences
      summary: Get user preferences
      description: Returns the current user's preferences, including the IANA time zone.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preference'
  /open/v1/project/{projectId}/task/{taskId}:
    get:
      tags:
        - Task
      operationId: GetTask
      summary: Get task by project ID and task ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    delete:
      tags:
        - Task
      operationId: DeleteTask
      summary: Delete task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /open/v1/project/{projectId}/task/{taskId}/complete:
    post:
      tags:
        - Task
      operationId: CompleteTask
      summary: Complete task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /open/v1/project/{projectId}/task/{taskId}/comments:
    get:
      tags:
        - Task
      operationId: GetTaskComments
      summary: Get task comments
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenComment'
  /open/v1/project/{projectId}/task/{taskId}/comment:
    post:
      tags:
        - Task
      operationId: AddTaskComment
      summary: Add task comment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenComment'
  /open/v1/project/{projectId}/task/{taskId}/comment/{id}:
    delete:
      tags:
        - Task
      operationId: DeleteTaskComment
      summary: Delete task comment
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Comment identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
  /open/v1/task:
    post:
      tags:
        - Task
      operationId: CreateTask
      summary: Create task
      description: Creates a task. title and projectId are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /open/v1/task/{taskId}:
    post:
      tags:
        - Task
      operationId: UpdateTask
      summary: Update task
      description: Updates a task. id and projectId are required in the body.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /open/v1/task/completeTasks:
    post:
      tags:
        - Task
      operationId: CompleteTasks
      summary: Complete multiple tasks
      description: Completes up to 50 tasks in one project. Only the first 50 task IDs are processed; if projectId is omitted or empty, the current user's inbox is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTasksRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /open/v1/task/move:
    post:
      tags:
        - Task
      operationId: MoveTasks
      summary: Move tasks between projects
      description: Moves one or more tasks between projects. Accepts a JSON array of move operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TaskMove'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MoveTaskResult'
  /open/v1/task/batch:
    post:
      tags:
        - Task
      operationId: BatchTasks
      summary: Batch create or update tasks
      description: Creates and updates tasks in a single request. Each add and update array supports up to 50 tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskBatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskBatchResult'
  /open/v1/task/assign:
    post:
      tags:
        - Task
      operationId: AssignTask
      summary: Assign task
      description: Assigns a task to a member of its project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /open/v1/task/unassign:
    post:
      tags:
        - Task
      operationId: UnassignTask
      summary: Unassign task
      description: Removes the assignee from a task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUnassignRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /open/v1/task/completed:
    post:
      tags:
        - Task
      operationId: ListCompletedTasks
      summary: List completed tasks
      description: Retrieves at most 200 tasks marked as completed within specific projects and a given completedTime range (startDate inclusive, endDate inclusive).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletedTasksFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /open/v1/task/filter:
    post:
      tags:
        - Task
      operationId: FilterTasks
      summary: Filter tasks
      description: Retrieves at most 200 tasks based on advanced filtering criteria, including project scope, date ranges, priority levels, tags, task kinds, and status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /open/v1/task/undone:
    post:
      tags:
        - Task
      operationId: ListUndoneTasks
      summary: List undone tasks
      description: Retrieves undone tasks within a date range of up to 14 days. startDate and endDate are required; an invalid range returns an empty array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndoneTasksFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /open/v1/task/search:
    post:
      tags:
        - Task
      operationId: SearchTasks
      summary: Search tasks
      description: Searches tasks by keywords and optional project, tag, status, and due-date filters. A supplied keywords value must not be blank; a blank value returns an empty array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSearchFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
  /open/v1/project:
    get:
      tags:
        - Project
      summary: List projects
      description: Returns the user's projects. Both pagination parameters are optional; when either one is provided, omitted or negative values default to offset 0 and limit 200.
      operationId: ListProjects
      parameters:
        - name: offset
          in: query
          required: false
          description: Zero-based result offset. When either pagination parameter is provided, omitted or negative values default to 0.
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          required: false
          description: Maximum number of projects to return. When either pagination parameter is provided, omitted or negative values default to 200.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags:
        - Project
      summary: Create a project
      description: Creates a new project and returns it.
      operationId: CreateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /open/v1/project/{projectId}:
    get:
      tags:
        - Project
      summary: Get a project by ID
      operationId: GetProject
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    post:
      tags:
        - Project
      summary: Update a project
      description: Updates the given project and returns the updated project.
      operationId: UpdateProject
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      tags:
        - Project
      summary: Delete a project
      operationId: DeleteProject
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
  /open/v1/project/{projectId}/data:
    get:
      tags:
        - Project
      summary: Get a project with its data
      description: Returns the project together with its undone tasks and columns.
      operationId: GetProjectData
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectData'
  /open/v1/project/{projectId}/members:
    get:
      tags:
        - Project
      summary: Get project members
      description: Returns the members of a project.
      operationId: GetProjectMembers
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
  /open/v1/project/group:
    get:
      tags:
        - ProjectGroup
      summary: List project groups
      operationId: ListProjectGroups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenProjectGroup'
    post:
      tags:
        - ProjectGroup
      summary: Create a project group
      description: Creates a project group. The name is required and limited to 64 characters.
      operationId: CreateProjectGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectGroup'
  /open/v1/project/group/{projectGroupId}:
    post:
      tags:
        - ProjectGroup
      summary: Update a project group
      description: Updates the given project group. The name is limited to 64 characters.
      operationId: UpdateProjectGroup
      parameters:
        - name: projectGroupId
          in: path
          required: true
          description: Project group identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenProjectGroup'
    delete:
      tags:
        - ProjectGroup
      summary: Delete a project group
      operationId: DeleteProjectGroup
      parameters:
        - name: projectGroupId
          in: path
          required: true
          description: Project group identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
  /open/v1/project/{projectId}/column:
    get:
      tags:
        - Column
      summary: List columns of a project
      operationId: ListColumns
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Column'
    post:
      tags:
        - Column
      summary: Create a column
      description: Creates a column in the project. The name is required and limited to 1000 characters.
      operationId: CreateColumn
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
  /open/v1/project/{projectId}/column/{columnId}:
    post:
      tags:
        - Column
      summary: Update a column
      description: Updates the given column. The name is limited to 1000 characters.
      operationId: UpdateColumn
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project identifier
          schema:
            type: string
        - name: columnId
          in: path
          required: true
          description: Column identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
  /open/v1/tag:
    get:
      tags:
        - Tag
      summary: List tags
      operationId: ListTags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenTag'
    post:
      tags:
        - Tag
      summary: Create a tag
      description: Creates a tag. Both name and label are limited to 64 characters; name must be lowercase and trimmed, and label must match name when lowercased.
      operationId: CreateTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenTag'
  /open/v1/focus/{focusId}:
    get:
      tags:
        - Focus
      summary: Get a focus by ID
      description: Returns a single focus record. The required type query parameter selects the focus kind (Pomodoro 0, Timing 1).
      operationId: GetFocus
      parameters:
        - name: focusId
          in: path
          required: true
          description: Focus identifier
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: 'Focus type: Pomodoro = 0, Timing = 1.'
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFocus'
    delete:
      tags:
        - Focus
      summary: Delete a focus
      description: Deletes a focus record. The required type query parameter selects the focus kind (Pomodoro 0, Timing 1).
      operationId: DeleteFocus
      parameters:
        - name: focusId
          in: path
          required: true
          description: Focus identifier
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: 'Focus type: Pomodoro = 0, Timing = 1.'
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFocus'
  /open/v1/focus:
    get:
      tags:
        - Focus
      summary: List focuses by time range
      description: Returns focus records within the given time range. If the range exceeds 30 days, the server automatically adjusts the start time to 30 days before `to`.
      operationId: ListFocuses
      parameters:
        - name: from
          in: query
          required: true
          description: Range start time.
          schema:
            type: string
            format: "yyyy-MM-dd'T'HH:mm:ssZ"
            example: '2026-04-01T00:00:00+0800'
        - name: to
          in: query
          required: true
          description: Range end time.
          schema:
            type: string
            format: "yyyy-MM-dd'T'HH:mm:ssZ"
            example: '2026-04-02T00:00:00+0800'
        - name: type
          in: query
          required: true
          description: 'Focus type: Pomodoro = 0, Timing = 1.'
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenFocus'
    post:
      tags:
        - Focus
      summary: Create a focus
      description: Creates a focus record and returns it.
      operationId: CreateFocus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenFocus'
  /open/v1/countdown:
    get:
      tags:
        - Countdown
      summary: List countdowns
      operationId: ListCountdowns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenCountdown'
  /open/v1/habit:
    get:
      tags:
        - Habit
      summary: List habits
      operationId: ListHabits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenHabit'
    post:
      tags:
        - Habit
      summary: Create a habit
      description: Creates a habit. The name is required and limited to 1000 characters.
      operationId: CreateHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHabit'
  /open/v1/habit/sections:
    get:
      tags:
        - Habit
      summary: List habit sections
      description: Returns the current user's habit sections.
      operationId: ListHabitSections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenHabitSection'
  /open/v1/habit/checkins:
    get:
      tags:
        - Habit
      summary: List habit check-ins
      description: Returns check-ins for the given habits within the date range. Dates use the YYYYMMDD integer stamp format.
      operationId: ListHabitCheckins
      parameters:
        - name: habitIds
          in: query
          required: true
          description: Habit identifiers separated by commas, e.g. habit-1,habit-2.
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: Start date stamp in YYYYMMDD format.
          schema:
            type: integer
            format: int32
        - name: to
          in: query
          required: true
          description: End date stamp in YYYYMMDD format.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenHabitCheckin'
  /open/v1/habit/{habitId}:
    get:
      tags:
        - Habit
      summary: Get a habit by ID
      operationId: GetHabit
      parameters:
        - name: habitId
          in: path
          required: true
          description: Habit identifier
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHabit'
    post:
      tags:
        - Habit
      summary: Update a habit
      description: Updates the given habit. An empty name is treated as null; the maximum length is 1000 characters.
      operationId: UpdateHabit
      parameters:
        - name: habitId
          in: path
          required: true
          description: Habit identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHabit'
  /open/v1/habit/{habitId}/checkin:
    post:
      tags:
        - Habit
      summary: Create or update a habit check-in
      description: Creates or updates the check-in for the given habit. The stamp is required and uses the YYYYMMDD integer format.
      operationId: CheckinHabit
      parameters:
        - name: habitId
          in: path
          required: true
          description: Habit identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitCheckinRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenHabitCheckin'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    ChecklistItem:
      type: object
      description: A subtask (checklist item) of a Task.
      properties:
        id:
          type: string
          description: Subtask identifier.
        title:
          type: string
          description: Subtask title.
        status:
          type: integer
          format: int32
          description: 'The completion status of the subtask. Normal: 0, Completed: 1.'
        completedTime:
          type: string
          description: 'Subtask completed time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        isAllDay:
          type: boolean
          description: Whether the subtask is all day.
        sortOrder:
          type: integer
          format: int64
          description: Subtask sort order.
          example: 234444
        startDate:
          type: string
          description: 'Subtask start date time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        timeZone:
          type: string
          description: Subtask timezone.
          example: America/Los_Angeles

    Task:
      type: object
      description: A task, including its subtasks and focus summaries.
      properties:
        id:
          type: string
          description: Task identifier.
        projectId:
          type: string
          description: Task project id.
        title:
          type: string
          description: Task title.
        isAllDay:
          type: boolean
          description: Whether the task is all day.
        completedTime:
          type: string
          description: 'Task completed time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        content:
          type: string
          description: Task content.
        desc:
          type: string
          description: Task description of checklist.
        dueDate:
          type: string
          description: 'Task due date time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        items:
          type: array
          description: Subtasks of the task.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        priority:
          type: integer
          format: int32
          description: 'Task priority. None: 0, Low: 1, Medium: 3, High: 5.'
        reminders:
          type: array
          description: List of reminder triggers.
          items:
            type: string
          example:
            - 'TRIGGER:P0DT9H0M0S'
            - 'TRIGGER:PT0S'
        tags:
          type: array
          description: Task tags.
          items:
            type: string
          example:
            - work
            - urgent
        repeatFlag:
          type: string
          description: Recurring rules of the task.
          example: 'RRULE:FREQ=DAILY;INTERVAL=1'
        repeatFrom:
          type: string
          description: 'Recurrence calculation mode; effective only when repeatFlag is present. 0: repeat from the original due/scheduled date; 1: repeat from the completion date while preserving the original time of day (no next occurrence is generated without a completion time); 2: default calendar recurrence in the task time zone, which skips expired occurrences and advances to the next applicable occurrence. 0 follows the original schedule, while 2 advances from the current date and is recommended for ordinary daily, weekly, or monthly recurrence. When omitted or empty, the server usually uses 2.'
          enum:
            - '0'
            - '1'
            - '2'
        sortOrder:
          type: integer
          format: int64
          description: Task sort order.
          example: 12345
        startDate:
          type: string
          description: 'Start date time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        status:
          type: integer
          format: int32
          description: 'Task completion status. Abandoned: -1, Normal: 0, Completed: 2.'
        assigneeUsername:
          type: string
          description: Username of the project member assigned to the task.
        timeZone:
          type: string
          description: Task timezone.
          example: America/Los_Angeles
        kind:
          type: string
          description: Task kind.
          enum:
            - TEXT
            - NOTE
            - CHECKLIST
        parentId:
          type: string
          description: 'Parent task identifier. Set to an empty string "" to remove the parent-child relationship.'
        focusSummaries:
          type: array
          description: Focus summaries of the task.
          items:
            $ref: '#/components/schemas/OpenFocusSummary'
        etag:
          type: string
          description: Entity tag (present in live responses).
        etimestamp:
          type: integer
          format: int64
          description: Entity timestamp, epoch milliseconds (present in live responses; not in official docs table).
        createdTime:
          type: string
          description: 'Created time in "yyyy-MM-dd''T''HH:mm:ssZ" format (present in live responses; not in official docs table).'
          example: '2020-01-02T03:04:05.000+0000'
        modifiedTime:
          type: string
          description: 'Modified time in "yyyy-MM-dd''T''HH:mm:ssZ" format (present in live responses; not in official docs table).'
          example: '2020-01-02T03:04:06.000+0000'
        isFloating:
          type: boolean
          description: Whether the task floats (no fixed time; present in live responses, not in official docs table).

    Project:
      type: object
      description: A project (task list) or note list.
      properties:
        id:
          type: string
          description: Project identifier.
        name:
          type: string
          description: Project name.
        color:
          type: string
          description: Project color.
        sortOrder:
          type: integer
          format: int64
          description: Order value.
        closed:
          type: boolean
          description: Whether the project is closed.
        groupId:
          type: string
          description: Project group identifier.
        viewMode:
          type: string
          description: View mode.
          enum:
            - list
            - kanban
            - timeline
        permission:
          type: string
          description: Project permission of the current user.
          enum:
            - read
            - write
            - comment
        kind:
          type: string
          description: Project kind.
          enum:
            - TASK
            - NOTE

    Column:
      type: object
      description: A kanban column of a project.
      properties:
        id:
          type: string
          description: Column identifier.
        projectId:
          type: string
          description: Project identifier.
        name:
          type: string
          description: Column name.
        sortOrder:
          type: integer
          format: int64
          description: Order value.

    OpenFocusSummary:
      type: object
      description: Focus (pomodoro) summary attached to a task.
      properties:
        pomoCount:
          type: integer
          format: int32
          description: Number of pomodoros.
        estimatedPomo:
          type: integer
          format: int32
          description: Estimated number of pomodoros.
        estimatedDuration:
          type: integer
          format: int32
          description: Estimated focus duration in seconds.
        pomoDuration:
          type: integer
          format: int64
          description: Focus duration in seconds.
        stopwatchDuration:
          type: integer
          format: int64
          description: Stopwatch duration in seconds.

    ProjectData:
      type: object
      description: A project together with its undone tasks and columns.
      properties:
        project:
          $ref: '#/components/schemas/Project'
        tasks:
          type: array
          description: Undone tasks under the project.
          items:
            $ref: '#/components/schemas/Task'
        columns:
          type: array
          description: Columns under the project.
          items:
            $ref: '#/components/schemas/Column'

    OpenPomodoroTaskBrief:
      type: object
      description: Brief information about a task related to a focus record.
      properties:
        taskId:
          type: string
          description: Task id.
        title:
          type: string
          description: Task title.
        projectName:
          type: string
          description: Project name (present in live responses; not in official docs table).
        tags:
          type: array
          description: Task tags (present in live responses; not in official docs table).
          items:
            type: string
        habitId:
          type: string
          description: Habit id.
        timerId:
          type: string
          description: Timer id.
        timerName:
          type: string
          description: Timer name.
        startTime:
          type: string
          description: 'Task focus start time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endTime:
          type: string
          description: 'Task focus end time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'

    OpenFocus:
      type: object
      description: A focus (pomodoro or timing) record.
      properties:
        id:
          type: string
          description: Focus unique id.
        userId:
          type: integer
          format: int64
          description: User id.
        type:
          type: integer
          format: int32
          description: 'Focus type. Pomodoro: 0, Timing: 1.'
        taskId:
          type: string
          description: Task id.
        note:
          type: string
          description: Focus note.
        tasks:
          type: array
          description: Related task briefs.
          items:
            $ref: '#/components/schemas/OpenPomodoroTaskBrief'
        status:
          type: integer
          format: int32
          description: Pomodoro status.
        startTime:
          type: string
          description: 'Focus start time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endTime:
          type: string
          description: 'Focus end time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        pauseDuration:
          type: integer
          format: int32
          description: Pause duration in seconds.
        adjustTime:
          type: integer
          format: int64
          description: Adjusted time in seconds.
        added:
          type: boolean
          description: Whether the record was added.
        createdTime:
          type: string
          description: 'Created time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        modifiedTime:
          type: string
          description: 'Modified time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        etimestamp:
          type: integer
          format: int64
          description: Entity timestamp.
        etag:
          type: string
          description: Entity tag.
        duration:
          type: integer
          format: int64
          description: Focus duration.
        relationType:
          type: array
          description: Relation types.
          items:
            type: integer
            format: int32

    OpenHabit:
