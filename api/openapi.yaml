          type: string
          description: 'Check-in time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        opTime:
          type: string
          description: 'Operation time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
