      properties:
        name:
          type: string
          description: Name of the project.
        color:
          type: string
          description: Color of the project.
        sortOrder:
          type: integer
          format: int64
          description: 'Sort order value, default 0.'
        viewMode:
          type: string
          description: View mode.
