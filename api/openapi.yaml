        dueDate:
          type: string
          description: 'Due date and time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        timeZone:
          type: string
          description: The time zone in which the time is specified.
        reminders:
          type: array
          description: Lists of reminders specific to the task.
          items:
            type: string
        tags:
          type: array
          description: Tags of the task.
          items:
            type: string
        repeatFlag:
          type: string
          description: Recurring rules of the task.
        repeatFrom:
          type: string
          description: 'Recurrence calculation mode; effective only when repeatFlag is present. 0: repeat from the original due/scheduled date; 1: repeat from the completion date while preserving the original time of day; 2: default calendar recurrence, advancing to the next applicable occurrence. When omitted or empty, the server usually uses 2.'
          enum:
            - '0'
            - '1'
            - '2'
        priority:
          type: integer
          format: int32
          description: 'The priority of the task, default is 0. None: 0, Low: 1, Medium: 3, High: 5.'
        sortOrder:
          type: integer
          format: int64
          description: The order of the task.
        items:
          type: array
          description: The list of subtasks.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        parentId:
          type: string
          description: 'Parent task identifier (extension present in the Task definition). Set to an empty string "" to remove the parent-child relationship.'
        kind:
          type: string
          description: 'Task kind (extension present in the Task definition).'
          enum:
            - TEXT
            - NOTE
            - CHECKLIST

    TaskUpdateRequest:
      type: object
      description: Request body for updating a task. Only id and projectId are required. parentId and kind are extensions of the documented request table, taken from the Task definition.
      required:
        - id
        - projectId
      properties:
        id:
          type: string
          description: Task id.
        projectId:
          type: string
          description: Project id.
        title:
          type: string
          description: Task title.
        content:
          type: string
          description: Task content.
        desc:
          type: string
          description: Description of checklist.
        isAllDay:
          type: boolean
          description: Whether the task is all day.
        startDate:
          type: string
          description: 'Start date and time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        dueDate:
          type: string
          description: 'Due date and time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        timeZone:
          type: string
          description: The time zone in which the time is specified.
        reminders:
          type: array
          description: Lists of reminders specific to the task.
          items:
            type: string
        tags:
          type: array
          description: Tags of the task.
          items:
            type: string
        repeatFlag:
          type: string
          description: Recurring rules of the task.
        repeatFrom:
          type: string
          description: 'Recurrence calculation mode; effective only when repeatFlag is present. 0: repeat from the original due/scheduled date; 1: repeat from the completion date while preserving the original time of day; 2: default calendar recurrence, advancing to the next applicable occurrence. When omitted or empty, the server usually uses 2.'
          enum:
            - '0'
            - '1'
            - '2'
        priority:
          type: integer
          format: int32
          description: 'The priority of the task, default is 0. None: 0, Low: 1, Medium: 3, High: 5.'
        sortOrder:
          type: integer
          format: int64
          description: The order of the task.
        items:
          type: array
          description: The list of subtasks.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        parentId:
          type: string
          description: 'Parent task identifier (extension present in the Task definition). Set to an empty string "" to remove the parent-child relationship.'
        kind:
          type: string
          description: 'Task kind (extension present in the Task definition).'
          enum:
            - TEXT
            - NOTE
            - CHECKLIST

    CompleteTasksRequest:
      type: object
      description: Request body for completing multiple tasks.
      required:
        - taskIds
      properties:
        projectId:
          type: string
          description: "Project identifier. Defaults to the current user's inbox when omitted or empty."
        taskIds:
          type: array
          description: Task IDs to complete. Only the first 50 IDs are processed.
          items:
            type: string

    TaskMove:
      type: object
      description: One task move operation.
      required:
        - fromProjectId
        - toProjectId
        - taskId
      properties:
        fromProjectId:
          type: string
          description: The ID of the source project.
        toProjectId:
          type: string
          description: The ID of the destination project.
        taskId:
          type: string
          description: The ID of the task to move.

    TaskBatchRequest:
      type: object
      description: Request body for batch creating and updating tasks. Each array supports up to 50 tasks.
      properties:
        add:
          type: array
          description: Tasks to create, up to 50 tasks.
          items:
            $ref: '#/components/schemas/TaskCreateRequest'
        update:
          type: array
          description: Tasks to update, up to 50 tasks.
          items:
            $ref: '#/components/schemas/TaskUpdateRequest'

    TaskAssignRequest:
      type: object
      description: Request body for assigning a task to a project member.
      required:
        - projectId
        - taskId
        - assigneeUsername
      properties:
        projectId:
          type: string
          description: Project containing the task.
        taskId:
          type: string
          description: Task identifier.
        assigneeUsername:
          type: string
          description: Username of a project member.

    TaskUnassignRequest:
      type: object
      description: Request body for removing the assignee from a task.
      required:
        - projectId
        - taskId
      properties:
        projectId:
          type: string
          description: Project containing the task.
        taskId:
          type: string
          description: Task identifier.

    CompletedTasksFilter:
      type: object
      description: Filter for completed tasks. All fields are optional. At most 200 tasks are returned.
      properties:
        projectIds:
          type: array
          description: List of project identifiers.
          items:
            type: string
        startDate:
          type: string
          description: 'The start of the time range (inclusive). Filters tasks where completedTime >= startDate. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endDate:
          type: string
          description: 'The end of the time range (inclusive). Filters tasks where completedTime <= endDate. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'

    TaskFilter:
      type: object
      description: Filter for querying tasks. All fields are optional. At most 200 tasks are returned.
      properties:
        projectIds:
          type: array
          description: Filters tasks belonging to the specified project IDs.
          items:
            type: string
        startDate:
          type: string
          description: 'Filters tasks where the task startDate >= startDate. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endDate:
          type: string
          description: 'Filters tasks where the task startDate <= endDate. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        priority:
          type: array
          description: 'Filters tasks by priority levels. None: 0, Low: 1, Medium: 3, High: 5.'
          items:
            type: integer
            format: int32
        tag:
          type: array
          description: Filters tasks that contain all of the specified tags.
          items:
            type: string
        kind:
          type: array
          description: Filters tasks by task kind (TEXT, NOTE, CHECKLIST).
          items:
            type: string
        status:
          type: array
          description: 'Filters tasks by status codes, e.g. [0] for Normal and [2] for Completed.'
          items:
            type: integer
            format: int32

    UndoneTasksFilter:
      type: object
      description: Filter for undone tasks. The date range may span at most 14 days.
      required:
        - startDate
        - endDate
      properties:
        projectIds:
          type: array
          description: 'Project IDs to query. Omit to search all accessible projects; use "inbox" for the inbox project.'
          items:
            type: string
        taskIds:
          type: array
          description: Restrict results to these task IDs.
          items:
            type: string
        startDate:
          type: string
          description: 'Start of the date range in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endDate:
          type: string
          description: 'End of the date range in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000"; must not precede startDate.'
          example: '2019-11-13T03:00:00+0000'

    TaskSearchFilter:
      type: object
      description: Filter for searching tasks. All fields are optional.
      properties:
        keywords:
          type: string
          description: Text to search for. A blank value yields an empty result.
        projectIds:
          type: array
          description: Project IDs to search.
          items:
            type: string
        tags:
          type: array
          description: Tags to filter by.
          items:
            type: string
        status:
          type: array
          description: 'Task statuses to filter by. Abandoned: -1, Normal: 0, Completed: 2.'
          items:
            type: integer
            format: int32
        dueFrom:
          type: string
          description: 'Include tasks due on or after this time. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        dueTo:
          type: string
          description: 'Include tasks due on or before this time. Format "yyyy-MM-dd''T''HH:mm:ssZ", e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'

    CommentCreateRequest:
      type: object
      description: Request body for creating a comment.
      required:
