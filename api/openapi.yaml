      properties:
        name:
          type: string
          description: Tag name (max 64 chars, lowercase, trimmed).
        label:
          type: string
          description: Tag label (max 64 chars, must match name when lowercased).

    FocusCreateRequest:
      type: object
      description: Request body for creating a focus record.
      required:
        - type
      properties:
        type:
          type: integer
          format: int32
          description: 'Focus type. Pomodoro: 0, Timing: 1.'
        taskId:
          type: string
          description: Task id.
        note:
          type: string
          description: Focus note (max 5000 chars).
        startTime:
          type: string
          description: 'Focus start time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        endTime:
          type: string
          description: 'Focus end time in "yyyy-MM-dd''T''HH:mm:ssZ" format, e.g. "2019-11-13T03:00:00+0000".'
          example: '2019-11-13T03:00:00+0000'
        pauseDuration:
          type: integer
          format: int32
          description: Pause duration in seconds.
        duration:
          type: integer
          format: int64
          description: Focus duration.
        relationType:
          type: array
          description: Relation types.
          items:
            type: integer
            format: int32

